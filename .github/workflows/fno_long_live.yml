name: F&O Long Strategy - Live Signals (3:15 PM)

on:
  schedule:
    # 09:25 UTC is 14:55 (2:55 PM) IST
    # Runs Monday through Friday
    - cron: '25 9 * * 1-5'
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  run-fno-long-strategy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Using a Personal Access Token or the default GITHUB_TOKEN
          # If using default, ensure workflow permissions allow read/write
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'
          cache-dependency-path: 'Quant_backend/requirements-live.txt'

      - name: Cache TA-Lib Compiled Source
        id: cache-talib
        uses: actions/cache@v4
        with:
          path: ta-lib
          key: ${{ runner.os }}-talib-0.4.0

      - name: Build TA-Lib
        if: steps.cache-talib.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y build-essential wget
          wget -q http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib && ./configure --prefix=/usr && make
          cd .. && rm -f ta-lib-0.4.0-src.tar.gz

      - name: Install TA-Lib to System
        run: |
          cd ta-lib && sudo make install

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Quant_backend/requirements-live.txt

      - name: Cache Market Data & F&O State
        uses: actions/cache@v4
        with:
          path: |
            Quant_backend/src/screener/pipeline/swing/data_cache
            Quant_backend/src/screener/pipeline/fno/strategies/long/output
          key: fno-market-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            fno-market-data-${{ runner.os }}-
            swing-market-data-${{ runner.os }}-
            fno-market-data-
            swing-market-data-

      - name: Run F&O Long Live Signals
        env:
          # Expose GitHub Secrets as environment variables for the Python script
          TELEGRAM_BOT_TOKEN_FNO: ${{ secrets.TELEGRAM_BOT_TOKEN_FNO }}
          TELEGRAM_CHAT_ID_FNO: ${{ secrets.TELEGRAM_CHAT_ID_FNO }}
        run: |
          cd Quant_backend
          python src/screener/pipeline/fno/strategies/long/live_signals.py

      - name: Upload F&O Portfolio State Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fno-portfolio-state-${{ github.run_id }}
          path: Quant_backend/src/screener/pipeline/fno/strategies/long/output/
          retention-days: 30
