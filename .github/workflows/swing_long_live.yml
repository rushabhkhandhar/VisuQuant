name: Swing Strategy - Live Signals & Portfolio Updates

on:
  schedule:
    # 09:45 UTC is 15:15 (3:15 PM) IST (BUY Signals)
    - cron: '45 9 * * 1-5'
    # 12:00 UTC is 17:30 (5:30 PM) IST (Portfolio Updates)
    - cron: '0 12 * * 1-5'
  workflow_dispatch:
    inputs:
      job_to_run:
        description: 'Which job to run manually?'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - buy_signals_only
        - portfolio_only

jobs:
  run-swing-buy-signals:
    # Run if triggered by the 09:45 cron, or manually with 'all'/'buy_signals_only'
    if: github.event_name == 'schedule' && github.event.schedule == '45 9 * * 1-5' || github.event_name == 'workflow_dispatch' && (github.event.inputs.job_to_run == 'all' || github.event.inputs.job_to_run == 'buy_signals_only')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install System Dependencies (TA-Lib)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y build-essential libta-lib-dev

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Quant_backend/requirements.txt
        env:
          TELEGRAM_BOT_TOKEN_SWING: ${{ secrets.TELEGRAM_BOT_TOKEN_SWING }}
          TELEGRAM_CHAT_ID_SWING: ${{ secrets.TELEGRAM_CHAT_ID_SWING }}
        run: |
          cd Quant_backend
          python src/screener/pipeline/swing/run_live_screener.py

      - name: Commit and Push Updated Ledger
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add any state files generated by the live screener
          git add Quant_backend/src/screener/pipeline/swing/
          
          git diff --staged --quiet || git commit -m "chore: update swing live signals ledger [skip ci]"
          git push origin main

  run-swing-portfolio-update:
    # Run if triggered by the 12:00 cron, or manually with 'all'/'portfolio_only'
    if: github.event_name == 'schedule' && github.event.schedule == '0 12 * * 1-5' || github.event_name == 'workflow_dispatch' && (github.event.inputs.job_to_run == 'all' || github.event.inputs.job_to_run == 'portfolio_only')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install System Dependencies (TA-Lib)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y build-essential libta-lib-dev

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Quant_backend/requirements.txt

      - name: Run Swing Portfolio Updates (5:30 PM)
        env:
          TELEGRAM_BOT_TOKEN_SWING_PORTFOLIO: ${{ secrets.TELEGRAM_BOT_TOKEN_SWING_PORTFOLIO }}
          TELEGRAM_CHAT_ID_SWING: ${{ secrets.TELEGRAM_CHAT_ID_SWING }}
        run: |
          cd Quant_backend
          python src/screener/pipeline/swing/run_front_test.py

      - name: Commit and Push Updated Portfolio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add any state files generated by the front test portfolio tracker
          git add Quant_backend/src/screener/pipeline/swing/
          
          git diff --staged --quiet || git commit -m "chore: update swing portfolio ledger [skip ci]"
          git push origin main
