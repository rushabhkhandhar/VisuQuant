name: Swing Strategy - Live Signals & Portfolio Updates

on:
  schedule:
    # 09:25 UTC is 14:55 (2:55 PM) IST (BUY Signals)
    - cron: '25 9 * * 1-5'
    # 12:00 UTC is 17:30 (5:30 PM) IST (Portfolio Updates) - DISABLED
    # - cron: '0 12 * * 1-5'
  workflow_dispatch:
    inputs:
      job_to_run:
        description: 'Which job to run manually?'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - buy_signals_only
        - portfolio_only

jobs:
  run-swing-buy-signals:
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job_to_run == 'all' || github.event.inputs.job_to_run == 'buy_signals_only'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'
          cache-dependency-path: 'Quant_backend/requirements.txt'

      - name: Cache TA-Lib Compiled Source
        id: cache-talib
        uses: actions/cache@v4
        with:
          path: ta-lib
          key: ${{ runner.os }}-talib-0.4.0

      - name: Build TA-Lib
        if: steps.cache-talib.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y build-essential wget
          wget -q http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib && ./configure --prefix=/usr && make
          cd .. && rm -f ta-lib-0.4.0-src.tar.gz

      - name: Install TA-Lib to System
        run: |
          cd ta-lib && sudo make install

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Quant_backend/requirements.txt

      - name: Run Swing Buy Signals (3:15 PM)
        env:
          TELEGRAM_BOT_TOKEN_SWING: ${{ secrets.TELEGRAM_BOT_TOKEN_SWING }}
          TELEGRAM_CHAT_ID_SWING: ${{ secrets.TELEGRAM_CHAT_ID_SWING }}
        run: |
          cd Quant_backend
          python src/screener/pipeline/swing/run_live_screener.py

      - name: Commit and Push Updated Ledger
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Quant_backend/src/screener/pipeline/swing/
          git pull --rebase origin main
          git diff --staged --quiet || git commit -m "chore: update swing live signals ledger [skip ci]"
          git push origin main

  run-swing-portfolio-update:
    if: false  # DISABLED - re-enable when portfolio job is ready
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Cache TA-Lib
        id: cache-talib
        uses: actions/cache@v4
        with:
          path: /usr/lib/libta_lib*
          key: talib-0.4.0-ubuntu-noble

      - name: Install TA-Lib from source
        if: steps.cache-talib.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y build-essential wget
          wget -q http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib && ./configure --prefix=/usr && make && sudo make install
          cd .. && rm -rf ta-lib ta-lib-0.4.0-src.tar.gz

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Quant_backend/requirements.txt

      - name: Run Swing Portfolio Updates (5:30 PM)
        env:
          TELEGRAM_BOT_TOKEN_SWING_PORTFOLIO: ${{ secrets.TELEGRAM_BOT_TOKEN_SWING_PORTFOLIO }}
          TELEGRAM_CHAT_ID_SWING: ${{ secrets.TELEGRAM_CHAT_ID_SWING }}
        run: |
          cd Quant_backend
          python src/screener/pipeline/swing/run_front_test.py

      - name: Commit and Push Updated Portfolio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Quant_backend/src/screener/pipeline/swing/
          git diff --staged --quiet || git commit -m "chore: update swing portfolio ledger [skip ci]"
          git push origin main
